name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.5'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP checks
        run: composer check

  node:
    name: Node.js
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check engines and package
        run: |
          npm run check:engines
          npm run lint

      - name: Run Node.js analysis and unit tests
        run: npm run analyse

      - name: Build plugin assets
        run: npm run build

      - name: Check licenses and release package
        run: |
          npm run check:licenses
          npm run release:verify

      - name: Test minimum WordPress
        run: npm run test:wordpress

      - name: Test current WordPress
        run: npm run test:wordpress:current

      - name: Test lifecycle
        run: npm run test:wordpress:lifecycle

      - name: Test multisite
        run: npm run test:wordpress:multisite

      - name: Test release ZIP
        run: npm run test:wordpress:release

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Build distributable plugin directory
        shell: bash
        run: |
          npm ci
          npm run build
          npm run release:verify
          mkdir -p tmp-build
          unzip -q "dist/turnierplan-eu-$(cat VERSION).zip" -d tmp-build

      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './tmp-build/turnierplan-eu'
          slug: turnierplan-eu
